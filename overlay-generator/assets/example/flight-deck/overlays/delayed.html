<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MK-21 · Delayed</title>
<link rel="stylesheet" href="board.css">
<style>
  /* Be right back: a single board row turns red. */
  .main { left: 360px; top: 330px; width: 1200px; padding: 30px 36px 34px; text-align: left; }
  .main .r { display: flex; align-items: center; gap: 26px; }
  .main .r + .r { margin-top: 22px; }
  .main .flaps { --fs: 72px; gap: 5px; }
  .main .sub { margin-top: 26px; font: 500 32px/1.3 'Barlow', sans-serif; color: var(--mute); }
  .alert { left: 360px; top: 40px; width: 1200px; }
</style>
</head>
<body>
  <div class="board edge main" data-piece="delayed">
    <div class="r"><span class="label dim">Flight</span><span class="flaps sign" id="flight"></span></div>
    <div class="r"><span class="label dim">Status</span><span class="flaps stop" id="status"></span></div>
    <p class="sub" id="sub">Captain stepped out of the cockpit. Stay seated, we'll be right back.</p>
  </div>
  <div class="board edge alert" id="alert" data-piece="alert">
    <div class="head"><span class="label">Boarding pass</span><span class="label dim kind">Gate S</span></div>
    <div class="row"><span class="flaps" data-len="24" style="--fs:40px"></span></div>
    <div class="info"><span class="what"></span><span class="plus"></span></div>
  </div>
<script src="../engine/pack.js"></script>
<script src="../engine/core.js"></script>
<script src="../engine/obs-link.js"></script>
<script src="../engine/ovg.js" data-page="delayed"></script>
<script src="board.js"></script>
<script>
  const $ = id => document.getElementById(id);
  Board.alertBoard($('alert'));
  OVG.onState(s => { Board.flap($('flight'), s.flight, 6); Board.flap($('status'), 'Delayed', 9); });
</script>
</body>
</html>
