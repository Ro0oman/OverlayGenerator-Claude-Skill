<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<style>
:root{--bg:#0f1014;--card:#1a1b21;--line:#2c2f38;--txt:#e8e9ee;--dim:#9a9dab;--acc:#ff8a3d}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",Inter,system-ui,sans-serif}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 20px 6px}
.top h1{font-size:20px}.top p{color:var(--dim)}
.grid{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:12px 20px 24px;align-items:start}
.panel{height:calc(100vh - 110px);min-height:640px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#17181d}
.panel iframe{width:100%;height:100%;border:0}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#222}
.stage .bd{position:absolute;inset:0}
.stage iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;background:transparent}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.bar span{color:var(--dim);font-size:12px;margin-right:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.bar button{font:600 13px/1 inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}
.bar button.on{border-color:var(--acc);color:#fff;background:#ff8a3d22}
.hint{color:var(--dim);font-size:12.5px;margin-top:10px}
@media (max-width:900px){.grid{grid-template-columns:1fr}.panel{height:620px;min-height:0}}
</style>
</head>
<body>
<div class="top"><h1 id="title"></h1><p id="sub"></p></div>
<div class="grid">
  <div class="panel"><iframe id="panel" title="panel"></iframe></div>
  <div>
    <div class="stage" id="stage"><div class="bd" id="bd"></div><iframe id="ov" title="overlay" allowtransparency="true"></iframe></div>
    <div class="bar" id="scenes"><span id="lScenes"></span></div>
    <div class="bar" id="alerts"><span id="lAlerts"></span></div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script src="engine/pack.js"></script>
<script>
(function () {
  const PACK = window.PACK, es = (PACK.lang || 'en').slice(0, 2) === 'es';
  const T = es ? { sub: 'Vista previa · todo funciona aquí sin OBS', scenes: 'Escenas', alerts: 'Probar alertas', hint: 'Pulsa los botones del panel de la izquierda: el overlay reacciona igual que en OBS. El fondo es de muestra; en OBS ahí va tu juego o tu cámara.' }
               : { sub: 'Preview · everything works here without OBS', scenes: 'Scenes', alerts: 'Test alerts', hint: 'Use the panel on the left: the overlay reacts exactly like in OBS. The background is a sample; in OBS your game or camera goes there.' };
  const $ = id => document.getElementById(id);
  $('title').textContent = PACK.name; $('sub').textContent = T.sub; $('hint').textContent = T.hint;
  $('lScenes').textContent = T.scenes; $('lAlerts').textContent = T.alerts;
  const panel = $('panel'), ov = $('ov');
  panel.src = 'panel.html?demo=1';
  let scene = null;
  function show(id) {
    const s = PACK.scenes.find(x => x.id === id) || PACK.scenes[0]; scene = s.id;
    ov.src = s.file + '?demo=1';
    $('bd').style.background = s.backdrop || 'linear-gradient(135deg,#2a2d38,#14151a)';
    document.querySelectorAll('#scenes button').forEach(b => b.classList.toggle('on', b.dataset.id === s.id));
  }
  PACK.scenes.forEach(s => { const b = document.createElement('button'); b.textContent = (s.icon ? s.icon + ' ' : '') + s.label; b.dataset.id = s.id; b.onclick = () => { show(s.id); panel.contentWindow.postMessage({ ovg: 'scene', id: s.id }, '*'); }; $('scenes').appendChild(b); });
  Object.keys(PACK.alerts || {}).forEach(a => { const d = PACK.alerts[a]; const b = document.createElement('button'); b.textContent = (d.icon ? d.icon + ' ' : '') + (d.label || a); b.onclick = () => panel.contentWindow.postMessage({ ovg: 'test', id: a }, '*'); $('alerts').appendChild(b); });
  window.addEventListener('message', e => {
    const d = e.data || {}; if (d.ovg !== 'msg') return;
    if (e.source === panel.contentWindow) {
      if (d.msg.type === 'scene') return show(d.msg.id);
      ov.contentWindow && ov.contentWindow.postMessage(d, '*');
    } else if (e.source === ov.contentWindow) panel.contentWindow.postMessage(d, '*');
  });
  function fit() { ov.style.transform = 'scale(' + $('stage').clientWidth / 1920 + ')'; }
  window.addEventListener('resize', fit); fit();
  show((PACK.scenes.find(s => s.format === 'game') || PACK.scenes[0]).id);
})();
</script>
</body>
</html>
