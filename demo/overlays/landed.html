<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MK-21 · Landed</title>
<link rel="stylesheet" href="board.css">
<style>
  /* Ending: arrivals board with the flight log and today's passenger manifest (new subs). */
  .main { left: 120px; top: 110px; width: 1080px; padding: 26px 32px 30px; }
  .main h1 { font: 700 40px/1 'Oswald', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--sign); }
  .main .r { display: grid; grid-template-columns: 260px 1fr; align-items: center; margin-top: 22px; }
  .main .flaps { --fs: 52px; }
  .man { left: 1260px; top: 110px; width: 540px; height: 860px; padding: 20px 22px; }
  .man .names { margin-top: 14px; columns: 2; column-gap: 22px; font: 600 28px/1.6 'Barlow', sans-serif; }
  .man .names div { break-inside: avoid; }
  .man .names div:before { content: '✓ '; color: var(--go); }
  .man .empty { margin-top: 14px; font: 500 28px/1.4 'Barlow', sans-serif; color: var(--mute); }
  .thanks { left: 120px; top: 760px; width: 1080px; padding: 22px 32px; font: 600 34px/1.3 'Barlow', sans-serif; }
  .thanks small { display: block; margin-top: 10px; font: 500 24px/1.3 'Barlow', sans-serif; color: var(--mute); }
</style>
</head>
<body>
  <div class="board edge main" data-piece="arrivals">
    <h1>Arrivals</h1>
    <div class="r"><span class="label dim">Flight</span><span class="flaps sign" id="flight"></span></div>
    <div class="r"><span class="label dim">Status</span><span class="flaps go" id="status"></span></div>
    <div class="r"><span class="label dim">Turbulence</span><span class="flaps stop" id="turb"></span></div>
    <div class="r"><span class="label dim">Stops</span><span class="flaps" id="stops"></span></div>
  </div>
  <div class="board man" data-piece="manifest">
    <span class="label">Passenger manifest · today</span>
    <div class="names" id="names"></div>
  </div>
  <div class="board thanks" data-piece="thanks">Thanks for flying MK-21. Same gate next time.
    <small id="credit"></small>
  </div>
<script src="../engine/pack.js"></script>
<script src="../engine/core.js"></script>
<script src="../engine/obs-link.js"></script>
<script src="../engine/ovg.js" data-page="landed"></script>
<script src="board.js"></script>
<script>
  const $ = id => document.getElementById(id);
  OVG.onState(s => {
    Board.flap($('flight'), s.flight, 6);
    Board.flap($('status'), 'Landed', 8);
    Board.flap($('turb'), String(s.turbulence).padStart(2, '0'), 2);
    Board.flap($('stops'), (Math.min(s.stop + 1, s.stops.length)) + '/' + s.stops.length, 5);
    const names = s.manifest.length ? s.manifest : [];
    $('names').innerHTML = '';
    if (!names.length) $('names').innerHTML = '<p class="empty">New boarding passes show up here.</p>';
    [...new Set(names)].slice(-22).forEach(n => { const d = document.createElement('div'); d.textContent = n; $('names').appendChild(d); });
    $('credit').textContent = OVG.creditOn ? 'Overlay made with OverlayGenerator' : '';
  });
</script>
</body>
</html>
